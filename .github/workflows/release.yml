name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC identity for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x; trusted publishing needs 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size

      # No token: npm exchanges the workflow's OIDC identity for a short-lived
      # credential, and attaches a provenance attestation on its own.
      - name: Publish
        run: npm publish --access public
